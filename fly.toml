app = "clash-of-champion"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "clash_data"
  destination = "/app/data"

[[services.http_checks]]
  interval = "20s"
  timeout = "3s"
  grace_period = "5s"
  method = "get"
  path = "/health"
